{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи{% endblock %}
{% block page_title %}Удаление статьи{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <p class="mb-4">Вы действительно хотите удалить "{{ object.title }}"?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
