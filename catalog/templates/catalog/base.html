{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">
    <aside class="bg-dark" style="width: 250px;">
        {% include 'catalog/includes/main_menu.html' %}
    </aside>

    <main class="flex-grow-1">
        <header class="bg-white border-bottom py-3 px-4">
            <div class="container-fluid">
                <h1 class="h3 mb-0">{% block page_title %}Skystore{% endblock %}</h1>
            </div>
        </header>

        <section class="py-4">
            <div class="container-fluid px-4">
                {% block content %}{% endblock %}
            </div>
        </section>
    </main>
</div>

</body>
</html>
