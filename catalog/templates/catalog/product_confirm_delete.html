{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}
{% block page_title %}Удаление товара{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="mb-4">Удалить товар <strong>{{ object.name }}</strong>?</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-outline-secondary">
                        Отмена
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
